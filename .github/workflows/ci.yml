# EMStudio CI — the FAST regression net on every push/PR.
#
# Scope is deliberate:
#   * python3 smoke (the Qt-free subset — FreeCAD document checks self-skip)
#   * the FAST validation-gate tier via tests/validation/run_battery.py
#     (whatever run_battery.FAST lists — the count is deliberately NOT
#     restated here. It read "17 gates" from 2026-07 until 2026-08-20, by
#     which point it was 42; it was corrected to 42 and went stale again the
#     next day at 43. Nothing reads a comment, so a number in one only ever
#     decays — same reason the tutorial counts were removed from HELP.md and
#     the public README. p452/p2001 SKIP here because the ITU digital maps
#     are integral products that are never bundled and not downloaded in CI)
# The SOLVER tier (nec2c/openEMS/Elmer/Palace/FastHenry, minutes each) stays a
# local pre-release step: python3 tests/validation/run_battery.py --all
#
# Linux runners only — free for public repos. Do NOT add macOS jobs (the
# account's macOS Actions minutes are billing-blocked; 10x multiplier).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action majors track the runner's Node. v4/v5 targeted node20, which
      # the runner now force-migrates to node24 and warns about on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # match the FreeCAD 1.1.1 AppImage's bundled python
          python-version: "3.11"

      - name: Install python deps
        run: python -m pip install numpy scipy matplotlib

      - name: Smoke (python3 subset)
        run: python tests/smoke.py

      - name: Validation battery (FAST tier)
        run: python tests/validation/run_battery.py
