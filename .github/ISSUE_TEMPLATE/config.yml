blank_issues_enabled: true
contact_links:
  # First on purpose: most people arriving here have a QUESTION, not a bug.
  # Discussions were turned on 2026-10-17 after a user said the forum thread
  # "is not the best option" and an issue "is too much for asking help from
  # the community" — he was right on both counts.
  - name: Ask a question (Q&A)
    url: https://github.com/king-aj3/EMStudioFree/discussions/categories/q-a
    about: >
      How do I…, why does…, is this the right way to model…? Ask in
      Discussions — answers can be marked accepted, searched, and given by
      other users too. Issues are for something EMStudio got wrong.
  - name: Does a gate already answer this?
    url: https://github.com/king-aj3/EMStudioFree/blob/master/docs/TUTORIALS.md
    about: >
      Every tutorial ends in a number and names the automated test that pins it.
      If a documented figure disagrees with yours, that gate's output is the
      fastest possible bug report.
  # ⚠ This pointed at docs/ROADMAP.md until 2026-08-26 — a 404 for every user
  # who clicked it, because ROADMAP.md is Pro-side and is NOT exported (see
  # tools/free_manifest.toml). CAPABILITIES.md IS exported and carries the
  # not-planned rows, each with its reason and its re-open trigger.
  - name: What is deliberately not planned
    url: https://github.com/king-aj3/EMStudioFree/blob/master/docs/CAPABILITIES.md
    about: >
      Some things are recorded as not-planned with the reason and a re-open
      trigger. Worth a look before writing a request.
