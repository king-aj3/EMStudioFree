<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A centre-fed dipole: two bold collinear arms, a red feed gap, and two
       radiation arcs pulled IN close so they do not read as brackets. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18,15 Q7,32 18,49" stroke="#00c2a8" stroke-width="5"/>
    <path d="M46,15 Q57,32 46,49" stroke="#00c2a8" stroke-width="5"/>
    <line x1="32" y1="4" x2="32" y2="26" stroke="#2b8cff" stroke-width="7"/>
    <line x1="32" y1="38" x2="32" y2="60" stroke="#2b8cff" stroke-width="7"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#ff5a5f"/>
</svg>
