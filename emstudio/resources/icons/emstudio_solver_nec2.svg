  </g>
  <g fill="#00c2a8">
    <circle cx="32" cy="8" r="4.5"/>
    <circle cx="32" cy="20" r="4.5"/>
    <circle cx="32" cy="44" r="4.5"/>
    <circle cx="32" cy="56" r="4.5"/>
    <circle cx="14" cy="46" r="4.5"/>
    <circle cx="50" cy="46" r="4.5"/>
